# E1 Arm C（证书适应度）配置：LLM 在证书携带的模板参数空间内进化
max_iterations: 40
checkpoint_interval: 10
log_level: "INFO"

language: "python"

llm:
  api_base: "https://api.deepseek.com"
  api_key: "${DEEPSEEK_API_KEY}"
  primary_model: "deepseek-flash"
  primary_model_weight: 1.0
  temperature: 0.8
  max_tokens: 32768
  timeout: 300
  retries: 2
  extra_body:
    thinking:
      type: enabled

prompt:
  num_top_programs: 3
  num_diverse_programs: 2
  use_template_stochasticity: true

database:
  population_size: 40
  archive_size: 24
  num_islands: 2
  feature_dimensions: ["precision", "area", "throughput"]
  feature_bins:
    precision: 8
    area: 8
    throughput: 4
  elite_selection_ratio: 0.2
  exploration_ratio: 0.3
  exploitation_ratio: 0.7

evaluator:
  cascade_evaluation: true
  cascade_thresholds: [0.2]
  timeout: 300
  parallel_evaluations: 2

diff_based_evolution: true
full_rewrite_probability: 0.5
max_code_length: 20000
