# 5 seeds 统计验证（manual 模式，混合模式最优配置：消融 C 组复刻）
random_seed: 42
max_iterations: 40
checkpoint_interval: 10
log_level: "INFO"
language: "verilog"
llm:
  manual_mode: true
  primary_model: "qoder-manual-seeds"
  primary_model_weight: 1.0
  temperature: 0.9
  max_tokens: 16384
prompt:
  num_top_programs: 3
  num_diverse_programs: 2
database:
  population_size: 40
  archive_size: 24
  num_islands: 2
  feature_dimensions: ["precision", "area", "throughput"]
  feature_bins: {precision: 8, area: 8, throughput: 4}
  elite_selection_ratio: 0.2
  exploration_ratio: 0.3
  exploitation_ratio: 0.7
evaluator:
  cascade_evaluation: true
  cascade_thresholds: [0.2]
  timeout: 300
  parallel_evaluations: 2
diff_based_evolution: true
full_rewrite_probability: 0.5
allow_full_rewrites: true
max_code_length: 20000
