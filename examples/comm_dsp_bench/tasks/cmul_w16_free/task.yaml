# CommDSP-Bench 生成实例（任务族第二层）：cmul_w16_free
# 由 task_family_gen.py 自动生成；golden/激励由 evaluator 按 family 分发

spec_version: 2
task: cmul_w16_free

spec: |
  实现复数乘法器：计算 (a + j*b) * (c + j*d) 的实部与虚部。

  输入 a/b/c/d 为 16 位 signed（Q1.15）；输出 y_re/y_im 为 33 位 signed。
  输出为全精度宽（33 位，定点化策略完全自由）。精度按与浮点参考的 SQNR 评估（相对全精度参考）。

dut_module: top

io_protocol:
  base: stream_v1
  inputs:
    - {name: a, width: 16, signed: true, format: 'signed Q1.15'}
    - {name: b, width: 16, signed: true, format: 'signed Q1.15'}
    - {name: c, width: 16, signed: true, format: 'signed Q1.15'}
    - {name: d, width: 16, signed: true, format: 'signed Q1.15'}
  outputs:
    - {name: y_re, width: 33, signed: true, format: 'signed'}
    - {name: y_im, width: 33, signed: true, format: 'signed'}
  extensions: []

golden:
  stimulus:
    distribution: uniform_iq
    samples: 65536
    seed: fresh_per_eval
  reference:
    impl: "float64（evaluator 按 family 注册分发，参数见 metric.params）"

metric:
  type: sqnr
  params:
    width: 16
    rounding: "free"

constraints: {}

timeouts:
  L1: 5
  L2_sim: 30
  L2_synth: 300
