# CommDSP-Bench task: fir
# See ../../SPEC.md for the full specification.

spec_version: 1
task: fir

# 该字段进入 LLM prompt（数学规范全文）。禁止包含任何算法提示（SPEC §9）。
spec: |
  实现 16 抽头线性相位低通 FIR 滤波器，截止频率 0.25*fs。

  滤波器系数（连续浮点，精确值见下）：h[0..15] 为 Hamming 窗法设计、
  直流增益归一为 1 的低通滤波器系数，满足对称性 h[k] = h[15-k]。
  精确系数值（十进制，按 k 顺序）：
    h[0] = -0.002409448759439328
  h[1] = -0.00416217525111597
  h[2] = 0.009536485427998098
  h[3] = 0.019970925995327866
  h[4] = -0.03795418069083629
  h[5] = -0.06957283292881049
  h[6] = 0.13736083919311107
  h[7] = 0.44723038701376505
  h[8] = 0.44723038701376505
  h[9] = 0.1373608391931111
  h[10] = -0.0695728329288105
  h[11] = -0.037954180690836316
  h[12] = 0.01997092599532787
  h[13] = 0.009536485427998096
  h[14] = -0.00416217525111597
  h[15] = -0.002409448759439328

  接口为流式握手协议（valid/ready）。输入 x 为 16 位有符号数（Q1.15，
  即 x_val = x/2^15）。输出 y 为 40 位有符号数，刻度规定为 Q9.30：
  y_val = y/2^30，且 y_val 应等于 sum_k h[k]*x_val[n-k]（滤波器历史
  初始为零：复位后前 15 拍输出为部分和）。

  复位释放后，每当 in_valid 与 in_ready 同时为高的时钟上升沿，DUT 采样
  一组输入；对应的输出应在 out_valid 为高时给出，out_ready 由测试环境
  保持为高。每组输入恰好产生一组输出，顺序保持。

  设计目标：在精度（相对浮点参考的 SQNR）、综合面积、吞吐三者之间探索
  不同的折中点，不同折中点都有价值。

dut_module: top

io_protocol:
  base: stream_v1
  inputs:
    - {name: x, width: 16, signed: true, format: "signed Q1.15"}
  outputs:
    - {name: y, width: 40, signed: true, format: "signed Q9.30（y_val = y/2^30 = sum h[k]*x_val[n-k]）"}
  extensions: []

golden:
  stimulus:
    distribution: gaussian_white
    samples: 65536
    seed: fresh_per_eval
  reference:
    impl: "float64 卷积（连续系数，零初始历史），刻度 2^30"

metric:
  type: sqnr
  params:
    coefficients:
      - -0.002409448759439328
      - -0.00416217525111597
      - 0.009536485427998098
      - 0.019970925995327866
      - -0.03795418069083629
      - -0.06957283292881049
      - 0.13736083919311107
      - 0.44723038701376505
      - 0.44723038701376505
      - 0.1373608391931111
      - -0.0695728329288105
      - -0.037954180690836316
      - 0.01997092599532787
      - 0.009536485427998096
      - -0.00416217525111597
      - -0.002409448759439328

constraints: {}

timeouts:
  L1: 5
  L2_sim: 30
  L2_synth: 60
