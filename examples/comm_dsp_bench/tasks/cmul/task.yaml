# CommDSP-Bench task: cmul (anchor task)
# See ../..//SPEC.md for the full specification.

spec_version: 1
task: cmul

# 该字段进入 LLM prompt（数学规范全文）。禁止包含任何算法提示（SPEC §9）。
spec: |
  实现一个复数乘法器：计算 (a + j*b) * (c + j*d) 的实部与虚部。

  接口为流式握手协议（valid/ready）。输入 a, b, c, d 为 16 位有符号数
  （signed Q1.15，二进制补码）。输出 y_re, y_im 为 33 位有符号数，
  语义为全精度乘积的和/差（不要求舍入或截断到更低位宽）。

  复位释放后，每当 in_valid 与 in_ready 同时为高的时钟上升沿，
  DUT 采样一组输入；对应的输出应在 out_valid 为高时给出，
  out_ready 由测试环境保持为高。每组输入恰好产生一组输出，顺序保持。

  设计目标：在满足精度（相对浮点参考的 SQNR）与吞吐的前提下，
  尽量降低综合后的电路面积。精度、面积、吞吐三者构成权衡空间，
  不同折中点都有价值。

dut_module: top

io_protocol:
  base: stream_v1
  inputs:
    - {name: a, width: 16, signed: true, format: "signed Q1.15 (a_re)"}
    - {name: b, width: 16, signed: true, format: "signed Q1.15 (a_im)"}
    - {name: c, width: 16, signed: true, format: "signed Q1.15 (b_re)"}
    - {name: d, width: 16, signed: true, format: "signed Q1.15 (b_im)"}
  outputs:
    - {name: y_re, width: 33, signed: true, format: "signed, 全精度积之和"}
    - {name: y_im, width: 33, signed: true, format: "signed, 全精度积之差"}
  extensions: []

golden:
  stimulus:
    distribution: uniform_iq
    samples: 65536
    seed: fresh_per_eval
  reference:
    impl: "float64 复数乘法（全精度，不量化）"

metric:
  type: sqnr
  params: {}

constraints: {}

timeouts:
  L1: 5        # 秒，冒烟仿真
  L2_sim: 30   # 秒，全量仿真
  L2_synth: 60 # 秒，综合
