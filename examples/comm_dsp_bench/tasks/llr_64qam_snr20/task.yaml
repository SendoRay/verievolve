# CommDSP-Bench 生成实例（任务族第二层）：llr_64qam_snr20
# 由 task_family_gen.py 自动生成；golden/激励由 evaluator 按 family 分发

spec_version: 2
task: llr_64qam_snr20

spec: |
  实现 64QAM 软解调器（bit-level LLR 计算，Gray 映射，TS 38.211 §5.1.3 风格）。

  输入为均衡后的星座点 (i_in, q_in)（Q4.12，值域约 ±8）。
  输出 6 个比特的对数似然比（LLR），每个 16 位 signed（Q8.8）。

  参考定义（LLR 的精确语义，实现方式不限）：
  对比特 b（0..5），设 S_b=1 为标准 64QAM Gray 星座中
  该比特为 1 的星座点集合，S_b=0 为该比特为 0 的集合（星座按 ±1/±3/.../±7 奇数格点，I/Q 独立映射）：
    LLR_b = ln( sum_{s in S_b=0} exp(-|y - s|^2 / (2*sigma2)) )
          - ln( sum_{s in S_b=1} exp(-|y - s|^2 / (2*sigma2)) )
  其中 sigma2 = 0.01（SNR = 20 dB 下的等效噪声方差，任务锁定）。
  正 LLR 表示比特更可能为 0（对数似然比按"0 假设 - 1 假设"定义）。

  注意：实现可采用任何数学等价或近似形式（如 max-log 近似）；精度按输出
  与浮点参考的 SQNR 评估。

dut_module: top

io_protocol:
  base: stream_v1
  inputs:
    - {name: i_in, width: 16, signed: true, format: 'signed Q4.12'}
    - {name: q_in, width: 16, signed: true, format: 'signed Q4.12'}
  outputs:
    - {name: llr0, width: 16, signed: true, format: 'signed Q8.8'}
    - {name: llr1, width: 16, signed: true, format: 'signed Q8.8'}
    - {name: llr2, width: 16, signed: true, format: 'signed Q8.8'}
    - {name: llr3, width: 16, signed: true, format: 'signed Q8.8'}
    - {name: llr4, width: 16, signed: true, format: 'signed Q8.8'}
    - {name: llr5, width: 16, signed: true, format: 'signed Q8.8'}
  extensions: []

golden:
  stimulus:
    distribution: qam_awgn
    samples: 65536
    seed: fresh_per_eval
  reference:
    impl: "float64（evaluator 按 family 注册分发，参数见 metric.params）"

metric:
  type: sqnr
  params:
    bits: 3
    snr_db: 20
    sigma2: 0.01
    gray: "standard_38211_style"

constraints: {}

timeouts:
  L1: 5
  L2_sim: 30
  L2_synth: 300
