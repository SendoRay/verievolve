<svg xmlns="http://www.w3.org/2000/svg" width="1660" height="1010" viewBox="0 0 1660 1010" role="img" aria-labelledby="title desc">
  <title id="title">VeriEvolve overall architecture</title>
  <desc id="desc">An overall architecture of the VeriEvolve system. OpenEvolve samples parents from a MAP-Elites archive, builds a prompt, obtains a design proposal from an LLM, deterministically lowers it to fixed-point RTL, and evaluates accuracy with an analytic error model and cost with real synthesis. The result updates the archive and exposes a Pareto design set.</desc>
  <defs>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#3F6F9F"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#B56C00"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#568F4D"/></marker>
    <marker id="arrowPurple" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#765B88"/></marker>
    <style>
      .t { font-family: Arial, Helvetica, sans-serif; fill:#222; } .title { font-size:24px; font-weight:700; } .sub { font-size:12px; fill:#555; } .lane { font-size:15px; font-weight:700; } .head { font-size:13px; font-weight:700; } .body { font-size:12px; } .small { font-size:10px; } .note { font-size:11px; fill:#666; } .box { stroke-width:1.5; } .edge { fill:none; stroke-width:1.7; stroke-linejoin:round; stroke-linecap:round; }
    </style>
  </defs>
  <rect width="1660" height="1010" fill="#fff"/>
  <text x="830" y="48" text-anchor="middle" class="t title">VeriEvolve: Analytic Error-Model–Driven Evolution of Fixed-Point Verilog</text>
  <text x="830" y="80" text-anchor="middle" class="t sub">Overall architecture: control flow (blue), parameterized implementation flow (orange), and independent measurements (green)</text>

  <rect x="50" y="210" width="230" height="130" rx="10" fill="#f5f5f5" stroke="#666" class="box"/>
  <text x="165" y="242" text-anchor="middle" class="t head">CommDSP-Bench task card</text><text x="165" y="267" text-anchor="middle" class="t body">Signal operation and fixed-point I/O</text><text x="165" y="287" text-anchor="middle" class="t body">Accuracy metric, scenario grid, protocol</text>
  <text x="165" y="378" text-anchor="middle" class="t note">Frozen specification; internal algorithm, word lengths,</text><text x="165" y="394" text-anchor="middle" class="t note">and microarchitecture remain searchable.</text>

  <rect x="340" y="110" width="590" height="410" fill="#fff" stroke="#6c8ebf" class="box"/><rect x="340" y="110" width="590" height="30" fill="#eaf2fb" stroke="#6c8ebf" class="box"/>
  <text x="355" y="131" class="t lane" fill="#1f4e79">Search control plane (OpenEvolve)</text>
  <rect x="525" y="160" width="230" height="100" rx="10" fill="#e1d5e7" stroke="#9673a6" class="box"/>
  <text x="640" y="188" text-anchor="middle" class="t head">MAP-Elites archive</text><text x="640" y="210" text-anchor="middle" class="t body">Precision × area × throughput</text><text x="640" y="230" text-anchor="middle" class="t body">Island populations and periodic migration</text>
  <rect x="370" y="330" width="145" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" class="box"/><text x="443" y="358" text-anchor="middle" class="t head">Parent sampling</text><text x="443" y="382" text-anchor="middle" class="t body">Elite / diverse / exploratory</text>
  <rect x="560" y="330" width="160" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" class="box"/><text x="640" y="358" text-anchor="middle" class="t head">Prompt builder</text><text x="640" y="380" text-anchor="middle" class="t body">Task spec + parent metrics</text><text x="640" y="396" text-anchor="middle" class="t body">+ artifacts</text>
  <rect x="765" y="330" width="135" height="80" rx="10" fill="#dae8fc" stroke="#6c8ebf" class="box"/><text x="833" y="355" text-anchor="middle" class="t head">LLM mutator</text><text x="833" y="378" text-anchor="middle" class="t body">Diff / full rewrite</text><text x="833" y="394" text-anchor="middle" class="t body">Structural jumps</text>
  <rect x="530" y="445" width="255" height="45" rx="10" fill="#ffe6cc" stroke="#d79b00" class="box"/><text x="658" y="464" text-anchor="middle" class="t head">Design proposal</text><text x="658" y="481" text-anchor="middle" class="t body">parameter dictionary / typed search IR</text>

  <rect x="340" y="560" width="590" height="190" fill="#fff" stroke="#d79b00" class="box"/><rect x="340" y="560" width="590" height="30" fill="#fff4e6" stroke="#d79b00" class="box"/><text x="355" y="581" class="t lane" fill="#7a4700">Parameterized implementation flow</text>
  <rect x="370" y="625" width="205" height="75" rx="10" fill="#ffe6cc" stroke="#d79b00" class="box"/><text x="473" y="651" text-anchor="middle" class="t head">Implementation space</text><text x="473" y="677" text-anchor="middle" class="t body">Structure • quantization • microarchitecture</text>
  <rect x="635" y="625" width="185" height="75" rx="10" fill="#ffe6cc" stroke="#d79b00" class="box"/><text x="728" y="651" text-anchor="middle" class="t head">Deterministic lowering</text><text x="728" y="677" text-anchor="middle" class="t body">Template / IR → synthesizable RTL</text>
  <rect x="840" y="625" width="70" height="75" rx="10" fill="#ffe6cc" stroke="#d79b00" class="box"/><text x="875" y="651" text-anchor="middle" class="t head">Fixed-point</text><text x="875" y="670" text-anchor="middle" class="t head">Verilog</text><text x="875" y="687" text-anchor="middle" class="t small">stream_v1 DUT</text>

  <rect x="980" y="110" width="390" height="640" fill="#fff" stroke="#82b366" class="box"/><rect x="980" y="110" width="390" height="30" fill="#edf7ed" stroke="#82b366" class="box"/><text x="995" y="131" class="t lane" fill="#356a2d">Independent measurement plane</text>
  <rect x="1015" y="180" width="320" height="135" rx="10" fill="#d5e8d4" stroke="#82b366" class="box"/><text x="1175" y="205" text-anchor="middle" class="t head">Analytic error model</text><text x="1175" y="227" text-anchor="middle" class="t body">Integer residual / convolution calculation</text><text x="1175" y="247" text-anchor="middle" class="t body">or deterministic enumeration / worst-case bound</text><text x="1175" y="273" text-anchor="middle" class="t body" fill="#356a2d">Deterministic precision; no sampling variance</text><text x="1175" y="296" text-anchor="middle" class="t small" fill="#356a2d">RTL bit-true calibration</text>
  <rect x="1015" y="435" width="320" height="135" rx="10" fill="#d5e8d4" stroke="#82b366" class="box"/><text x="1175" y="462" text-anchor="middle" class="t head">Hardware implementation measurement</text><text x="1175" y="485" text-anchor="middle" class="t body">iverilog compile + Yosys synthesis</text><text x="1175" y="505" text-anchor="middle" class="t body">ice40 resource count and Nangate45 cell area</text><text x="1175" y="535" text-anchor="middle" class="t body" fill="#356a2d">Measured cost, not predicted cost</text>
  <rect x="1050" y="635" width="250" height="75" rx="10" fill="#e1d5e7" stroke="#9673a6" class="box"/><text x="1175" y="660" text-anchor="middle" class="t head">Evaluation result</text><text x="1175" y="682" text-anchor="middle" class="t body">precision, area, throughput</text><text x="1175" y="698" text-anchor="middle" class="t body">+ diagnostics / artifacts</text>
  <rect x="1430" y="185" width="190" height="120" rx="10" fill="#e1d5e7" stroke="#9673a6" class="box"/><text x="1525" y="213" text-anchor="middle" class="t head">Pareto design set</text><text x="1525" y="238" text-anchor="middle" class="t body">Precision–area–throughput</text><text x="1525" y="255" text-anchor="middle" class="t body">trade-offs for downstream</text><text x="1525" y="272" text-anchor="middle" class="t body">selection / system experiments</text>

  <g class="edge" stroke="#666" marker-end="url(#arrowBlue)"><path d="M280 275H310V430H550V370H560"/></g><text x="380" y="423" class="t small">specification</text>
  <g class="edge" stroke="#3f6f9f" marker-end="url(#arrowBlue)"><path d="M582 260V300H443V330"/><path d="M515 370H560"/><path d="M720 370H765"/><path d="M833 410V468H785"/></g><text x="455" y="293" class="t small">select parents</text><text x="522" y="362" class="t small">parents + artifacts</text><text x="727" y="362" class="t small">mutation prompt</text><text x="842" y="448" class="t small">propose</text>
  <g class="edge" stroke="#b56c00" marker-end="url(#arrowOrange)"><path d="M620 490V625H473"/><path d="M575 663H635"/><path d="M820 663H840"/></g><text x="548" y="608" class="t small">instantiate</text><text x="583" y="655" class="t small">legal design point</text><text x="823" y="655" class="t small">generate</text>
  <g class="edge" stroke="#568f4d" marker-end="url(#arrowGreen)"><path d="M785 468H920V640H960V248H1015"/><path d="M910 663H980V503H1015"/></g><text x="795" y="455" class="t small">parameters + semantics</text><text x="985" y="557" class="t small">RTL</text>
  <g class="edge" stroke="#568f4d" marker-end="url(#arrowGreen)"><path d="M1127 315H1350V620H1238V635"/><path d="M1223 570V600H1238V635"/></g><text x="1300" y="475" class="t small">precision</text><text x="1240" y="610" class="t small">area + throughput</text>
  <g class="edge" stroke="#765b88" stroke-dasharray="6 4" marker-end="url(#arrowPurple)"><path d="M1300 673H1400V95H640V160"/></g><text x="1000" y="91" class="t small">feedback: metrics + artifacts</text>
  <g class="edge" stroke="#765b88" marker-end="url(#arrowPurple)"><path d="M755 210H960V105H1400V245H1430"/></g><text x="1080" y="119" class="t small">nondominated designs</text>

  <rect x="50" y="810" width="230" height="110" fill="#fff" stroke="#999" class="box"/><text x="65" y="834" class="t head">Legend</text><rect x="65" y="847" width="22" height="16" fill="#dae8fc" stroke="#6c8ebf"/><text x="100" y="860" class="t note">Search control</text><rect x="65" y="872" width="22" height="16" fill="#ffe6cc" stroke="#d79b00"/><text x="100" y="885" class="t note">Candidate / implementation</text><rect x="65" y="897" width="22" height="16" fill="#d5e8d4" stroke="#82b366"/><text x="100" y="910" class="t note">Independent measurement</text>
  <rect x="340" y="820" width="1030" height="80" rx="10" fill="#fff9e8" stroke="#d6b656" class="box"/><text x="355" y="850" class="t head" fill="#5d4a00">Key innovation:</text><text x="473" y="850" class="t body" fill="#5d4a00">accuracy is a continuous, deterministic optimization signal inside the evolutionary loop—rather than a binary</text><text x="355" y="874" class="t body" fill="#5d4a00">correctness gate or a noisy simulation estimate. The search can therefore retain precision-negotiable hardware trade-offs.</text>
</svg>
